<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label name="Nombre">Nombre: </label>
        <input type="text" id="TextNombre"><br><br>
        <label name="Nombre">Apellidos: </label>
        <input type="text" id="TextApellido"><br><br>
        <label name="Nombre">Ciudad: </label>
        <input type="text" id="TextCiudad"><br><br>
        <label name="Nombre">Edad: </label>
        <input type="text" id="NumEdad"><br><br>
        <input type="button" id="btnSend" value="Enviar">
        </form>

            <fieldset>
                <legend>Hobbies</legend>
                <input type="checkbox" name="hobbies[]" value="Deporte">Deporte
                <input type="checkbox" name="hobbies[]" value="Musica">Musica
                <input type="checkbox" name="hobbies[]" value="Leer">Leer
                <input type="checkbox" name="hobbies[]" value="Cine">Cine
                <input type="checkbox" name="hobbies[]" value="Bailar">Bailar
                <input type="checkbox" name="hobbies[]" value="Cantar">Cantar
            </fieldset>

        <table border="1">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Ciudad</th>
                    <th>Edad</th>
                    <th>Hobbies</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody id="datos"></tbody>
        </table>

        <ol>
            <li id ="max">Máximo: </li>
            <li id="min">Mínimo: </li>
            <li id="suma">Suma: </li>
            <li id="media">Media: </li>
        </ol>

     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
     <script>
        let personas = []

        function serializar(objeto) {
            return JSON.stringify(objeto);
        }

        function deserializar(json) {
            return JSON.parse(json);
        }

        function edadMax(lista) {
            if (lista.length === 0) return 0;
            return Math.max(...lista.map(p => p.edad));
        }

         function edadMin(lista) {
            if (lista.length === 0) return 0;
            return Math.min(...lista.map(p => p.edad));
        }

        function sumaEdad(lista) {
            return lista.reduce((acc, p) => acc + p.edad, 0);
        }

        function mediaEdades(lista) {
            if (lista.length === 0) return 0;
            return sumaEdad(lista) / lista.length
        }

        function pintarLista(lista) {
            $("#max").text(`Máxima: ${edadMax(lista)} años.`);
            $("#min").text(`Mínimo: ${edadMin(lista)} años.`);
            $("#suma").text(`Suma: ${sumaEdad(lista)} años.`)
            $("#media").text(`Media ${mediaEdades(lista)} años.`)
        }

        function pintarTabla(lista) {
            let $datos = $("#datos");
            $datos.empty();
            lista.forEach((p, index) => {
                let $tr = $("<tr>");
                $tr.append($("<td>").text(p.nombre));
                $tr.append($("<td>").text(p.apellido));
                $tr.append($("<td>").text(p.ciudad));
                $tr.append($("<td>").text(p.edad));
                $tr.append($("<td>").text(p.hobbies));

                let $btnBorrar = $("<button>").text("Borrar").click(function () {
                    personas.splice(index, 1);
                    actualizarInterfaz();
                });

                let $tdAccion = $("<td>").append($btnBorrar);
                $tr.append($tdAccion);
                $datos.append($tr);
            });
        }

        function actualizarInterfaz() {
            pintarTabla(personas);
            pintarLista(personas);
        }

        $(document).ready(function() {
            $("#btnSend").click(function() {
                if (!comprobarInputs()) {
                    alert("Comprueba que los valores son correctos y que la edad es mayor a 0")
                    return;
                }


                let hobbiesSeleccionados = $('input[name="hobbies[]"]:checked').map(function() {
                    return $(this).val();
                }).get().join(", ");

                let persona = {
                    nombre: $("#TextNombre").val(),
                    apellido: $("#TextApellido").val(),
                    ciudad: $("#TextCiudad").val(),
                    edad: parseInt($("#NumEdad").val()),
                    hobbies: hobbiesSeleccionados
                };
                personas.push(persona);
                actualizarInterfaz();
                $("#TextNombre, #TextApellido, #NumEdad, #TextCiudad").val("");
                $('input[type="checkbox"]').prop('checked', false).prop('disabled', false)
            });

            function comprobarInputs() {
            let Nombre = $("#TextNombre").val().trim()
            let Apellido = $("#TextApellido").val().trim()
            let Ciudad = $("#TextCiudad").val().trim()
            let Edad = $("#NumEdad").val()

            console.log("Nombre leído:", Nombre);
            console.log("Apellido leído:", Apellido);
            console.log("Ciudad leída:", Ciudad);
            console.log("Edad leída:", Edad);
            console.log("¿La edad es mayor que 0?", parseInt(Edad) > 0);
            
            return Nombre !== "" && Apellido !== "" && Ciudad !== "" && parseInt(Edad) > 0
            }

            $('input[type="checkbox"]').on('change', function() {
               
               let contadorPulsado = $('input:checkbox').filter(':checked').length;
                
                if (contadorPulsado >= 3) {
                    $('input:checkbox:not(:checked)').prop('disabled', true);
                } else {
                    $('input[type="checkbox"]').prop('disabled', false);
                }
            });
        })
     </script>

</body>
</html>
